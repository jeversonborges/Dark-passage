# /etc/nginx/sites-available/darkpassage
# Depois: ln -s para sites-enabled, nginx -t, systemctl reload nginx,
# e certbot --nginx -d darkpassage.com.br -d www.darkpassage.com.br (ele reescreve este arquivo
# com o bloco 443 e o redirecionamento).

server {
    listen 80;
    listen [::]:80;
    server_name darkpassage.com.br www.darkpassage.com.br;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # a rota que o servidor do jogo usa nunca pode vir de fora
    location /api/interno/ { return 404; }
}
