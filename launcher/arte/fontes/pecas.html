<!doctype html><html><head><meta charset="utf-8">
<!-- Peças do launcher do DARK PASSAGE. Cada elemento com data-peca vira um PNG transparente (gerar.js).
     Materiais e fontes vêm do kit da HUD (assets/ui/src/barra) para o launcher ter a mesma mão do jogo. -->
<style>
@font-face{font-family:Cinzel;src:url(/launcher/fontes/cinzel-bold.woff2);font-weight:700}
@font-face{font-family:Cinzel;src:url(/launcher/fontes/cinzel.woff2);font-weight:400}
@font-face{font-family:Fell;src:url(/launcher/fontes/fell.woff2)}
@font-face{font-family:Fell;src:url(/launcher/fontes/fell-italic.woff2);font-style:italic}
@font-face{font-family:Pirata;src:url(/launcher/fontes/PirataOne-Regular.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;padding:20px;font-family:Cinzel;color:#e8dfc9}
.peca{position:relative;margin:0 20px 30px 0;overflow:hidden;display:inline-block;vertical-align:top}
.abs{position:absolute}
.latao{background:url(/assets/ui/src/barra/tex_latao.svg)}
.couro{background:url(/assets/ui/src/barra/tex_couro.svg)}
.ferro{background:url(/assets/ui/src/barra/tex_ferro.svg)}
.bisel{box-shadow:inset 0 1px 0 rgba(255,226,160,.55),inset 0 2px 0 rgba(255,210,140,.18),inset 0 -2px 0 rgba(0,0,0,.6),inset 0 -3px 6px rgba(0,0,0,.35),0 0 0 1px #0b0806}
.rebite{position:absolute;width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffe6b0 0,#c9954a 30%,#6a4418 70%,#1a0e04 100%);box-shadow:0 1px 1.5px rgba(0,0,0,.9),0 0 0 .5px #000}
.rebite.p{width:6px;height:6px}
.rebite.f{background:radial-gradient(circle at 35% 30%,#b9b2a6 0,#6c655c 35%,#2a2622 75%,#0a0807 100%)}
.poco{position:absolute;background:#090706;border-radius:2px;
  box-shadow:inset 0 3px 6px #000,inset 0 0 0 1px #000,0 1px 0 rgba(255,220,150,.28),0 -1px 0 rgba(0,0,0,.6)}
.costura{position:absolute;border:1.2px dashed rgba(214,180,120,.45)}
.painel{position:absolute;border-radius:3px;
  background:linear-gradient(180deg,rgba(14,11,9,.86),rgba(8,6,5,.9));
  box-shadow:0 0 0 1px #000,0 0 0 2px rgba(150,112,60,.55),0 0 0 3px #000,inset 0 0 40px rgba(0,0,0,.8),0 6px 18px rgba(0,0,0,.8)}
.grav{font-family:Cinzel;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:#2a1806;text-shadow:0 1px 0 rgba(255,226,160,.55),0 -1px 0 rgba(0,0,0,.5)}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <filter id="grao" x="0" y="0" width="100%" height="100%">
   <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
   <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .5 -.18"/>
  </filter>
  <filter id="nevoa" x="0" y="0" width="100%" height="100%">
   <feTurbulence type="fractalNoise" baseFrequency=".004 .012" numOctaves="4" seed="12" result="n"/>
   <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .58  0 0 0 0 .52  0 0 0 1.4 -.62"/>
  </filter>
  <filter id="liq" x="0" y="0" width="100%" height="100%">
   <feTurbulence type="fractalNoise" baseFrequency=".09 .35" numOctaves="3" seed="21" stitchTiles="stitch" result="t"/>
   <feColorMatrix in="t" type="matrix" values="0 0 0 0 .75  0 0 0 0 1  0 0 0 0 .45  0 0 0 1.3 -.55" result="w"/>
   <feComposite in="w" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="sombra"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000" flood-opacity=".95"/></filter>
  <linearGradient id="latG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d998"/><stop offset=".25" stop-color="#c08a44"/><stop offset=".6" stop-color="#7a4f22"/><stop offset="1" stop-color="#2e1a08"/></linearGradient>
  <linearGradient id="latD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d998"/><stop offset=".3" stop-color="#b07a3a"/><stop offset=".6" stop-color="#5a3816"/><stop offset=".85" stop-color="#a87238"/><stop offset="1" stop-color="#3a2208"/></linearGradient>
  <linearGradient id="ferG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c756c"/><stop offset=".4" stop-color="#37322e"/><stop offset="1" stop-color="#121010"/></linearGradient>
  <radialGradient id="gema" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="#eaffc0"/><stop offset=".25" stop-color="#9cff3a"/><stop offset=".7" stop-color="#2f6a10"/><stop offset="1" stop-color="#0c1a04"/></radialGradient>
  <radialGradient id="gemaBrilho" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9cff3a" stop-opacity=".55"/><stop offset="1" stop-color="#9cff3a" stop-opacity="0"/></radialGradient>

   <path d="M5 5 H58" stroke="rgba(255,230,170,.55)" stroke-width="1"/>
   <path d="M5 5 V58" stroke="rgba(255,230,170,.4)" stroke-width="1"/>
   <path d="M2 2 L30 30" stroke="#0b0806" stroke-width="0"/>
   <!-- placa com arco -->
   <path d="M4 4 H34 V22 Q34 34 22 34 H4 Z" fill="url(#latD)" stroke="#0b0806" stroke-width="1.4"/>
   <path d="M4 4 H34 V22 Q34 34 22 34 H4 Z" fill="url(#pTexLat)" opacity=".5"/>
   <path d="M11 28 V17 Q11 11 18 9 Q25 11 25 17 V28 Z" fill="#0c0806" stroke="rgba(255,220,150,.35)" stroke-width=".8"/>
   <path d="M18 13 V26 M14 17.5 H22" stroke="#b07a3a" stroke-width="1.6" stroke-linecap="square"/>
   <circle cx="30" cy="8" r="2.1" fill="#e7c27c" stroke="#1a0e04" stroke-width=".8"/>
   <circle cx="8" cy="30" r="2.1" fill="#e7c27c" stroke="#1a0e04" stroke-width=".8"/>
   <circle cx="48" cy="6" r="1.6" fill="#d9b06a" stroke="#1a0e04" stroke-width=".7"/>
   <circle cx="6" cy="48" r="1.6" fill="#d9b06a" stroke="#1a0e04" stroke-width=".7"/>
  </symbol>
  <pattern id="pTexLat" width="512" height="256" patternUnits="userSpaceOnUse"><image href="/assets/ui/src/barra/tex_latao.svg" width="512" height="256"/></pattern>
 </defs>
</svg>

<script>
const $=s=>document.querySelector(s);
// rebites ao longo da moldura de ferro
let r='';
for(let x=90;x<=870;x+=60){ r+=`<div class="rebite f p" style="left:${x}px;top:3px"></div><div class="rebite f p" style="left:${x}px;top:591px"></div>`; }
for(let y=90;y<=510;y+=60){ r+=`<div class="rebite f p" style="left:3px;top:${y}px"></div><div class="rebite f p" style="left:951px;top:${y}px"></div>`; }
